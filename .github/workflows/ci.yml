name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q
      - name: Regenerate and clean the dataset
        run: python src/run_pipeline.py --skip-notebook
      - name: Execute the notebook end-to-end
        run: python -m jupyter nbconvert --to notebook --execute notebooks/ecommerce_customer_analytics.ipynb --output /tmp/executed.ipynb --ExecutePreprocessor.timeout=600

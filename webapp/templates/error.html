{% extends "base.html" %}
{% block title %}{{ code }} · E-commerce Customer Analytics{% endblock %}
{% block content %}
<div class="card" style="max-width:640px;margin:40px auto;text-align:center;padding:40px">
  <div style="font-family:Cambria,Georgia,serif;font-size:56px;font-weight:700;color:var(--amber)">{{ code }}</div>
  <p style="font-size:17px">{{ message }}</p>
  <p><a class="btn" href="{{ url_for('dashboard') }}">Back to the dashboard</a></p>
</div>
{% endblock %}

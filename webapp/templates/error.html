{% extends "base.html" %}
{% block title %}{{ code }} · Customer Analytics{% endblock %}
{% block content %}
<div class="empty-state">
  <div class="code">Error {{ code }}</div>
  <h1>{{ 'Page not found' if code == 404 else 'Something went wrong' }}</h1>
  <p>{{ message }}</p>
  <a class="btn" href="{{ url_for('dashboard') }}">Go to overview</a>
</div>
{% endblock %}
